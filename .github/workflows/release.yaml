name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      promotion_id:
        description: Exact promotion ID to recover or cancel
        required: true
        type: string
      operation:
        description: Recovery or cancellation (uses the publication lock)
        required: true
        default: recover
        type: choice
        options: [recover, cancel]

# Release runs share the gh-pages index; let each publication finish before the next.
concurrency:
  group: chart-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.RELEASE_NOTES_ENABLED != 'true' && github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'docs:')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      CR_GIT_REPO: ${{ github.event.repository.name }}
      CR_OWNER: ${{ github.repository_owner }}

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: setup chart tools
        uses: ./.github/actions/setup-chart-tools

      - name: find changed charts
        id: changed-charts
        run: |
          git fetch --tags
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 --first-parent HEAD)

          subcharts_changed=false
          kompass_changed=false
          : > "$RUNNER_TEMP/changed-subcharts"

          while IFS= read -r chart; do
            if [[ ! -f "$chart/Chart.yaml" ]]; then
              continue
            fi

            if [[ "$chart" == "charts/kompass" ]]; then
              kompass_changed=true
            else
              printf '%s\n' "$chart" >> "$RUNNER_TEMP/changed-subcharts"
              subcharts_changed=true
            fi
          done < <(git diff --find-renames --name-only "$latest_tag" -- charts | cut -d/ -f1-2 | sort -u)

          echo "subcharts=$subcharts_changed" >> "$GITHUB_OUTPUT"
          echo "kompass=$kompass_changed" >> "$GITHUB_OUTPUT"

      - name: prepare chart dependencies from this commit
        if: steps.changed-charts.outputs.subcharts == 'true' || steps.changed-charts.outputs.kompass == 'true'
        run: sh scripts/ci/prepare-charts.sh .ci-charts

      - name: install chart releaser
        if: steps.changed-charts.outputs.subcharts == 'true' || steps.changed-charts.outputs.kompass == 'true'
        uses: helm/chart-releaser-action@v1.5.0
        with:
          install_only: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: initialize release directories
        if: steps.changed-charts.outputs.subcharts == 'true' || steps.changed-charts.outputs.kompass == 'true'
        run: |
          rm -rf .cr-index .cr-release-packages
          mkdir -p .cr-index .cr-release-packages

      - name: package subcharts
        if: steps.changed-charts.outputs.subcharts == 'true'
        run: |
          while IFS= read -r chart; do
            helm package ".ci-charts/${chart#charts/}" --destination .cr-release-packages
          done < "$RUNNER_TEMP/changed-subcharts"

      - name: package kompass
        if: steps.changed-charts.outputs.kompass == 'true'
        run: helm package .ci-charts/kompass --destination .cr-release-packages

      - name: publish charts and index
        if: steps.changed-charts.outputs.subcharts == 'true' || steps.changed-charts.outputs.kompass == 'true'
        run: |
          cr upload --commit "$GITHUB_SHA"
          # Build one index containing all packages, from the current Pages branch.
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          cr index --push
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  reviewed-release:
    if: vars.RELEASE_NOTES_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      CR_GIT_REPO: ${{ github.event.repository.name }}
      CR_OWNER: ${{ github.repository_owner }}
      CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NOTES_ENABLED: ${{ vars.RELEASE_NOTES_ENABLED }}
      RELEASE_NOTES_PRODUCT_IDS: ${{ vars.RELEASE_NOTES_PRODUCT_IDS }}
      RELEASE_NOTES_RECOVERY_PROJECT: ${{ vars.RELEASE_NOTES_RECOVERY_PROJECT }}
      RELEASE_NOTES_RECOVERY_TOKEN: ${{ secrets.RELEASE_NOTES_RECOVERY_TOKEN }}
      RELEASE_NOTES_INDEX_URL: ${{ vars.RELEASE_NOTES_INDEX_URL }}
      CI_API_V4_URL: ${{ vars.RELEASE_NOTES_GITLAB_API_URL || 'https://gitlab.com/api/v4' }}
    steps:
      - name: Checkout trusted publication code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.sha }}
      - name: Configure Git identity
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Set up chart tools
        uses: ./.github/actions/setup-chart-tools
      - name: Install chart releaser for index repair
        uses: helm/chart-releaser-action@v1.5.0
        with:
          install_only: true
      - name: Publish fixed reviewed manifest or recover exact stored bytes
        env:
          PROMOTION_ID: ${{ inputs.promotion_id }}
          OPERATION: ${{ inputs.operation }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci/release_notes_github.py "$OPERATION" --promotion "$PROMOTION_ID"
          else
            python3 scripts/ci/release_notes_github.py publish
          fi
