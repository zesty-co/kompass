name: helm-lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    if: "!startsWith(github.event.pull_request.title, 'chore:') && !startsWith(github.event.pull_request.title, 'docs:')"
    permissions:
      contents: read
    name: Helm Lint
    runs-on: ubuntu-latest
    env:
      CHARTS: "kompass kompass-pod-placement kompass-insights pod-rightsizing"

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup chart tools
        uses: ./.github/actions/setup-chart-tools

      - name: test local chart preparation
        run: sh scripts/ci/prepare-charts-test.sh

      - name: detect chart changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base origin/main HEAD)
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            base="$BEFORE_SHA"
          else
            base=$(git hash-object -t tree /dev/null)
          fi

          any_changed=false
          for chart in $CHARTS; do
            chart_path="charts/$chart"
            chart_key="${chart//-/_}_changed"
            # Rightsizing is added by the first promotion, after this workflow lands.
            if [[ ! -f "$chart_path/Chart.yaml" ]] || git diff --quiet "$base" HEAD -- "$chart_path"; then
              echo "$chart_key=false" >> "$GITHUB_ENV"
            else
              echo "$chart_key=true" >> "$GITHUB_ENV"
              any_changed=true
            fi
          done
          echo "any_chart_changed=$any_changed" >> "$GITHUB_ENV"

      - name: validate Chart.yaml version changed in PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          for chart in $CHARTS; do
            chart_key="${chart//-/_}_changed"
            chart_path="charts/$chart"
            [[ "${!chart_key}" == true ]] || continue
            # A newly introduced chart has no previous release to compare against.
            if ! git cat-file -e "origin/main:$chart_path/Chart.yaml" 2>/dev/null; then
              echo "New chart: $chart"
              continue
            fi
            main_version=$(git show "origin/main:$chart_path/Chart.yaml" | yq -r '.version')
            pr_version=$(yq -r '.version' "$chart_path/Chart.yaml")
            main_version="${main_version#v}"
            pr_version="${pr_version#v}"
            if [[ "$(printf '%s\n' "$pr_version" "$main_version" | sort -V | head -n1)" == "$pr_version" ]]; then
              echo "$chart version ($pr_version) must be greater than main ($main_version)." >&2
              exit 1
            fi
          done

      - name: prepare chart dependencies from this commit
        if: env.any_chart_changed == 'true'
        run: sh scripts/ci/prepare-charts.sh .ci-charts

      - name: setup helm plugins
        if: env.any_chart_changed == 'true'
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.3

      - name: helm unittest kompass secret
        if: env.any_chart_changed == 'true'
        run: helm unittest .ci-charts/kompass

      - name: helm lint
        if: env.any_chart_changed == 'true'
        run: |
          set -euo pipefail
          # Validate rightsizing only through the umbrella, including child-only changes.
          helm lint .ci-charts/kompass --set rightsizing.enabled=false
          helm lint .ci-charts/kompass --set rightsizing.enabled=true
          for chart in $CHARTS; do
            [[ "$chart" != kompass && "$chart" != pod-rightsizing ]] || continue
            chart_key="${chart//-/_}_changed"
            if [[ "${!chart_key}" == true ]]; then
              helm lint ".ci-charts/$chart"
            fi
          done
