name: Release Notes review event

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

# This event runs in PR context. It must not check out code or receive secrets.
# The default-branch workflow_run listener performs the privileged review check.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Review event received'
