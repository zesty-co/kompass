name: Deploy Chart To ECR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: "!startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'docs:')"
    runs-on: [gh-runner-production] # your self-hosted label (arm64 is fine)
    container:
      image: ubuntu:22.04
      volumes:
        - /var/run/secrets/eks.amazonaws.com/serviceaccount/token:/var/run/secrets/eks.amazonaws.com/serviceaccount/token
    permissions:
      contents: read
    env:
      AWS_WEB_IDENTITY_TOKEN_FILE: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      DEBIAN_FRONTEND: noninteractive
      TZ: Etc/UTC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Utilities
        run: |
          set -eu pipefail
          export DEBIAN_FRONTEND=noninteractive
          export TZ=Etc/UTC
          ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime || true
          apt-get update
          apt-get install -y --no-install-recommends tzdata
          dpkg-reconfigure -f noninteractive tzdata || true
          apt-get install -y --no-install-recommends curl ca-certificates tar git awscli
          rm -rf /var/lib/apt/lists/*

      - name: Set up chart tools
        uses: ./.github/actions/setup-chart-tools

      - name: Prepare and package chart from this commit
        run: |
          sh scripts/ci/prepare-charts.sh .ci-charts
          helm package .ci-charts/kompass --destination dist

      - name: Deploy Chart To ECR
        run: |
          for region in $(echo ${{ vars.AVAILABLE_ECR_REGIONS}} | tr "," "\n"); do
            aws ecr get-login-password --region "$region" \
              | helm registry login --username AWS --password-stdin  "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$region.amazonaws.com"
            helm push dist/kompass-*.tgz oci://${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$region.amazonaws.com/
          done
