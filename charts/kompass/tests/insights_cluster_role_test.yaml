suite: Insights RBAC through umbrella values
templates:
  - charts/kompass-insights/templates/clusterRole.yaml
tests:
  - it: defaults to no Secret reads
    asserts:
      - hasDocuments:
          count: 1
      - notContains:
          path: rules[*].apiGroups
          content: "*"
      - notContains:
          path: rules[*].resources
          content: secrets
  - it: forwards explicit discovery and extension settings
    set:
      kompass-insights.insights.clusterRole.fullRO: true
      kompass-insights.insights.clusterRole.extraRules:
        - apiGroups: [example.com]
          resources: [widgets]
          verbs: [get]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["*"]
            resources: ["*"]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [example.com]
            resources: [widgets]
            verbs: [get]
