suite: Parent-owned supported kinds Secret
templates:
  - templates/dependencies/supported-kinds-secret.yaml
  - templates/validations.yaml
tests:
  - it: renders the default Secret in the release namespace with separate YAML lists
    template: templates/dependencies/supported-kinds-secret.yaml
    release:
      namespace: zesty-system
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: kompass-supported-kinds
      - equal:
          path: metadata.namespace
          value: zesty-system
      - equal:
          path: type
          value: Opaque
      - matchRegex:
          path: stringData.supportedKinds
          pattern: '(?s).*Kind: Deployment.*Kind: ClusterVirtualWorkload.*'
      - equal:
          path: stringData.additionalSupportedKinds
          value: '[]'

  - it: serializes custom supported kinds without dropping optional resource fields
    template: templates/dependencies/supported-kinds-secret.yaml
    set:
      global.supportedKindsSecretName: custom-supported-kinds
      global.supportedKinds:
        - Group: example.test
          Version: v1
          Kind: Example
          Alias: example
          Properties: [Native]
          Resource: examples
      global.additionalSupportedKinds:
        - Group: example.test
          Version: v1
          Kind: Additional
          Alias: additional
    asserts:
      - equal:
          path: metadata.name
          value: custom-supported-kinds
      - equal:
          path: stringData.supportedKinds
          value: |-
            - Alias: example
              Group: example.test
              Kind: Example
              Properties:
              - Native
              Resource: examples
              Version: v1
      - equal:
          path: stringData.additionalSupportedKinds
          value: |-
            - Alias: additional
              Group: example.test
              Kind: Additional
              Version: v1
