suite: Validator and cluster-ID hook pull credentials
templates:
  - templates/pre-install-hooks/kompass-validator.yaml
  - templates/pre-install-hooks/insights-cluster-id-hook.yaml
set:
  kompass-insights.enabled: false
  global.zestyImageRegistry: private.example.com
tests:
  - it: gives global precreated credentials precedence for both hooks
    set:
      global.imagePullSecrets:
        - name: global-credentials
      validator.imagePullSecrets:
        - name: component-credentials
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-credentials

  - it: uses the validator credentials for both hooks when the global list is empty
    set:
      global.imagePullSecrets: []
      validator.imagePullSecrets:
        - name: component-credentials
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: component-credentials

  - it: uses the pre-install pull Secret for both hooks when credentials are supplied inline
    set:
      global.imagePullSecret:
        name: registry-credentials
        dockerconfigjson: e30=
    documentSelector:
      path: kind
      value: Job
      matchMany: true
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-credentials-validator-hook
      - equal:
          path: type
          value: kubernetes.io/dockerconfigjson
        template: templates/pre-install-hooks/kompass-validator.yaml
        documentSelector:
          path: metadata.name
          value: registry-credentials-validator-hook
      - equal:
          path: data[".dockerconfigjson"]
          value: e30=
        template: templates/pre-install-hooks/kompass-validator.yaml
        documentSelector:
          path: metadata.name
          value: registry-credentials-validator-hook
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
        template: templates/pre-install-hooks/kompass-validator.yaml
        documentSelector:
          path: metadata.name
          value: registry-credentials-validator-hook
