suite: Guardian request-ceiling validation
templates:
  - templates/validations.yaml
tests:
  - it: accepts complete enabled workload ceilings
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    asserts:
      - notFailedTemplate: {}

  - it: accepts disabled VictoriaMetrics components without annotations
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      victoriaMetrics:
        server:
          enabled: false
          annotations: null
      victoriaMetricsCluster:
        enabled: true
        vmselect:
          enabled: false
          annotations: null
        vminsert:
          enabled: false
          annotations: null
        vmstorage:
          enabled: false
          annotations: null
    asserts:
      - notFailedTemplate: {}

  - it: rejects an empty Pod Placement ceiling in read-only mode
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kompass-pod-placement:
        enabled: false
      global:
        guardian:
          requestCeilings:
            podPlacement:
              pod-placement:
                cpuRequest: ""
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.podPlacement.containers.pod-placement.cpuRequest is required

  - it: accepts Grafana ceilings without the disabled dashboard sidecar
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      grafana:
        sidecar:
          dashboards:
            enabled: false
        annotations:
          guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{"grafana":{"cpuRequest":"1m","memoryRequest":"1Mi"},"grafana-sc-datasources":{"cpuRequest":"1m","memoryRequest":"1Mi"}}}'
    asserts:
      - notFailedTemplate: {}

  - it: accepts Grafana ceilings without the disabled datasource sidecar
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      grafana:
        sidecar:
          datasources:
            enabled: false
        annotations:
          guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{"grafana":{"cpuRequest":"1m","memoryRequest":"1Mi"},"grafana-sc-dashboard":{"cpuRequest":"1m","memoryRequest":"1Mi"}}}'
    asserts:
      - notFailedTemplate: {}

  - it: skips cainjector annotation validation when disabled
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      cert-manager:
        cainjector:
          enabled: false
          deploymentAnnotations:
            guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{}}'
    asserts:
      - notFailedTemplate: {}

  - it: accepts manager ceilings when Insights manager is enabled
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kompass-insights:
        manager:
          enabled: true
      global:
        guardian:
          requestCeilings:
            insights:
              manager:
                cpuRequest: 100m
                memoryRequest: 128Mi
    asserts:
      - notFailedTemplate: {}

  - it: requires manager ceilings when Insights manager is enabled
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kompass-insights:
        manager:
          enabled: true
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.insights.containers.manager is required

  - it: rejects kube-state-metrics name overrides
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kubeStateMetrics:
        nameOverride: custom-kube-state-metrics
    asserts:
      - failedTemplate:
          errorMessage: kubeStateMetrics.nameOverride must be kube-state-metrics when Guardian request ceilings are enabled

  - it: rejects Grafana name overrides
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      grafana:
        nameOverride: custom-grafana
    asserts:
      - failedTemplate:
          errorMessage: grafana.nameOverride must be grafana when Guardian request ceilings are enabled

  - it: rejects an empty first-party CPU request
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      global.guardian.requestCeilings.insights.kompass-insights.cpuRequest: ""
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.insights.containers.kompass-insights.cpuRequest is required

  - it: rejects an empty first-party memory request
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      global.guardian.requestCeilings.insights.kompass-insights.memoryRequest: ""
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.insights.containers.kompass-insights.memoryRequest is required

  - it: rejects an empty third-party memory request
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kubeStateMetrics:
        annotations:
          guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{"kube-state-metrics":{"cpuRequest":"1m","memoryRequest":""}}}'
    asserts:
      - failedTemplate:
          errorMessage: kubeStateMetrics.annotations[guardian.kompass.zesty.co/request-ceilings].containers.kube-state-metrics.memoryRequest is required

  - it: rejects a missing third-party CPU request
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kubeStateMetrics:
        annotations:
          guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{"kube-state-metrics":{"memoryRequest":"1Mi"}}}'
    asserts:
      - failedTemplate:
          errorMessage: kubeStateMetrics.annotations[guardian.kompass.zesty.co/request-ceilings].containers.kube-state-metrics.cpuRequest is required

  - it: rejects a missing third-party container
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kubeStateMetrics:
        annotations:
          guardian.kompass.zesty.co/request-ceilings: '{"version":1,"containers":{}}'
    asserts:
      - failedTemplate:
          errorMessage: kubeStateMetrics.annotations[guardian.kompass.zesty.co/request-ceilings].containers.kube-state-metrics is required

  - it: rejects a missing third-party workload annotation
    values:
      - fixtures/valid-guardian-request-ceilings.yaml
    set:
      kubeStateMetrics:
        annotations: null
    asserts:
      - failedTemplate:
          errorMessage: kubeStateMetrics.annotations[guardian.kompass.zesty.co/request-ceilings] is required
