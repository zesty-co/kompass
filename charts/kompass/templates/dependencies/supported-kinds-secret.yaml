apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.supportedKindsSecretName }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  supportedKinds: |-
{{ toYaml .Values.global.supportedKinds | indent 4 }}
  additionalSupportedKinds: |-
{{ toYaml .Values.global.additionalSupportedKinds | indent 4 }}
