    resources:
      requests:
        cpu: 100m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 128Mi

victoriaMetricsAuth:
  resources:
    requests:
      cpu: 100m
      memory: 16Mi
    limits:
      cpu: 200m
      memory: 32Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 200m
      memory: 560Mi
    limits:
      cpu: 300m
