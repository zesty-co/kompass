# Apply this file with the Kompass chart to enable Guardian and rightsizing for
# Kompass workloads and use the Guardian resource profile for third-party dependencies.
global:
  guardian:
    enabled: true

rightsizing:
  enabled: true
  config:
    kompassWorkloadsRightsizing:
      enabled: true

victoriaMetrics:
  server:
    resources:
      requests:
        memory: "688Mi"
        cpu: "200m"
      limits:
        memory: "864Mi"
        cpu: "300m"

victoriaMetricsCluster:
  vmselect:
    resources:
      requests:
        memory: "640Mi"
        cpu: "530m"
      limits:
        memory: "896Mi"
        cpu: "689m"
  vminsert:
    resources:
      requests:
        memory: "300Mi"
        cpu: "100m"
      limits:
        memory: "420Mi"
        cpu: "130m"
  vmstorage:
    resources:
      requests:
        memory: "1000Mi"
        cpu: "500m"
      limits:
        memory: "1400Mi"
        cpu: "650m"
  vmauth:
    resources:
      requests:
        cpu: 100m
        memory: 16Mi
      limits:
        cpu: 200m
        memory: 32Mi

victoriaMetricsAgent:
  resources:
    requests:
      cpu: 100m
      memory: 160Mi
    limits:
      cpu: 200m
      memory: 208Mi

victoriaMetricsAlert:
