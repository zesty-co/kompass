global:
  # Overrides the registry for Insights, Manager, and self-monitoring images.
  zestyImageRegistry: ""
  # Shared license location for Insights and Manager.
  license:
    # Manager provisions the missing license key on startup, including first-time setup,
    # through registry polling. Manager always runs alongside Insights. If the entire
    # Insights chart is disabled, provision it externally in the release namespace.
    # The chart does not create, mount, or populate it.
    secretName: kompass-license
    documentKey: kompass_license
  nodeSelector: {}
  tolerations: []
  affinity: {}
  automountServiceAccountToken: ~
  imagePullSecrets: ~
  # Workload annotations applied to the Insights and Manager Deployment metadata.
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  # Pod-level settings. These take precedence over legacy pod keys under `securityContext`.
  podSecurityContext: {}
  runtimeClassName: ~
  # Container-level settings. Legacy pod-level keys mixed here are tolerated and moved to pod securityContext.
  securityContext: {}
  topologySpreadConstraints: ~
  imagePullSecret:
    name: ""
    dockerconfigjson: ""
  guardian:
    enabled: false
orgID: ""
log:
  level: 0
  remote: true
imagePullSecrets: []
image:
  repository: "672188301118.dkr.ecr.eu-west-1.amazonaws.com/zesty-k8s/agent"
  pullPolicy: Always
  tag: ~
nameOverride: ~
fullnameOverride: ~
serviceAccount:
  annotations: {}
externalID: ~
container:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
securityContext:
  fsGroup: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 2Gi
# Resources applied when Guardian protects this workload.
guardianProtectedResources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1000m
    memory: 2.5Gi
prometheus:
  url: ~
  username: ~
  password: ~
  bearerToken: ~
awsAthena:
  enabled: false
  curV2: false
  athenaProjectID: ~
  athenaBucketName: ~
  athenaRegion: ~
  athenaDatabase: ~
  athenaTable: ~
  athenaWorkgroup: ~
  athenaCatalog: ~
assumeRole:
  enabled: false
  masterRoleArn: ~
  masterExternalID: ~
  zestyExternalID: ~
  roleArn: ~
metadata:
  enabled: false
  provider: ~
  accountID: ~
  region: ~
  clusterName: ~
podMinuteMetrics:
  enabled: true
customPricing:
  # Positive, finite numbers or numeric strings. Null spot rates use the on-demand rate.
  cpu: "0.031611"
  ram: "0.004237"
  spotCpu: "0.006655"
  spotRam: "0.000892"
insights:
  extraEnv: []
  # Pod settings and workload annotations are also inherited by Manager.
  annotations: {}
  affinity: {}
  automountServiceAccountToken: ~
  clusterRole:
    fullRO: true
  imagePullSecrets: ~
  podAnnotations: {}
  podLabels: {}
  # Pod-level settings. These take precedence over legacy pod keys under `securityContext`.
  podSecurityContext: {}
  runtimeClassName: ~
  # Container-level settings. Legacy pod-level keys mixed here are tolerated and moved to pod securityContext.
  securityContext: {}
  topologySpreadConstraints: ~
  secret: "kompass-insights-secret"
  service: "kompass-insights-svc"
  grpc:
    port: 50051
    server:
      port: 50052
  metrics:
    port: 9003
  health:
    port: 9000
manager:
  repository: "672188301118.dkr.ecr.eu-west-1.amazonaws.com/zesty-k8s/kompass-manager"
  pullPolicy: Always
  # -- Manager image tag; defaults to image.tag, or Chart.AppVersion when image.tag is unset.
  tag: v0.0.3
  # -- False runs Manager as an Insights sidecar; true runs a separate host-networked Deployment.
  hostNetwork: false
  # -- (array) additional command-line arguments for the manager container
  extraArgs: []
  # -- (array) additional Kompass manager environment variables
  env: []
  # -- (array) list of sources to populate environment variables from (ConfigMaps/Secrets)
  envFrom: []
  # -- (array) additional volumes to attach to the manager pod
  extraVolumes: []
  # -- (array) additional volume mounts for the manager container
  extraVolumeMounts: []
  # -- (map) Container-level security context for the manager container.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  # -- (map) Container resource requests/limits.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi
  # -- Probe timing overrides. Exec handlers are fixed; legacy HTTP handlers are ignored.
  probes:
    startup:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 12
    liveness:
      initialDelaySeconds: 0
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
admission:
  enabled: false
  service:
    name: "kompass-admission-controller-svc"
pvcExpansion:
  enabled: true
  # -- (string) A percentage threshold to limit pvb utilization
  threshold: 80
  # -- (string) The size by which to expand a PVC that exceeded its disk utilization
  # threshold. The size can be either percentage or resource quantity ("20%"/"5Gi")
  expansionSize: "20%" # Amount to expand by,
cxLogging:
  enabled: false
  clusterName: ""
  apiKey: ""
  apiKeySecret:
    name: kompass-cx-logging
    key: CX_API_KEY
  domain: "eu2.coralogix.com"
  logUrl: "https://ingress.eu2.coralogix.com:443/logs/v1/singles"
  timeDeltaUrl: "https://ingress.eu2.coralogix.com:443/sdk/v1/time"
  ingressLogsUrl: "https://ingress.eu2.coralogix.com/logs/v1/singles"
  ingressUrl: "https://ingress.eu2.coralogix.com/"
  otelEndpoint: ""
selfMonitoring:
  schedule: "*/5 * * * *"
  affinity: {}
  automountServiceAccountToken: ~
  imagePullSecrets: ~
  serviceAccount:
    annotations: {}
  podAnnotations: {}
  podLabels: {}
  # Pod-level security context applied to self-monitoring pods.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  podSecurityContext: {}
  # Example:
  # podSecurityContext:
  #   runAsNonRoot: true
  #   runAsUser: 65532
  #   runAsGroup: 65532
  #   seccompProfile:
  #     type: RuntimeDefault
  runtimeClassName: ~
  # Container-level security context applied to self-monitoring containers.
  securityContext: {}
  # Example:
  # securityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  #   seccompProfile:
  #     type: RuntimeDefault
  topologySpreadConstraints: ~
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
