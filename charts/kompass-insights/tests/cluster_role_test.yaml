suite: Insights ClusterRole permissions
templates:
  - templates/clusterRole.yaml
tests:
  - it: automatically grants only named ROSA discovery reads on OpenShift
    capabilities:
      apiVersions:
        - config.openshift.io/v1/Infrastructure
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [config.openshift.io]
            resources: [infrastructures]
            resourceNames: [cluster]
            verbs: [get]
      - equal:
          path: rules[?(@.resources[0] == "secrets")]
          value:
            apiGroups: [""]
            resources: [secrets]
            resourceNames: [ebs-cloud-credentials]
            verbs: [get]
      - notContains:
          path: rules[*].apiGroups
          content: "*"
      - notContains:
          path: rules[?(@.apiGroups[0] == "")].resources
          content: "*"
  - it: excludes Secret reads by default while retaining operational permissions
    asserts: &restricted
      - hasDocuments:
          count: 1
      - notContains:
          path: rules[*].apiGroups
          content: "*"
      - notContains:
          path: rules[*].resources
          content: secrets
      - notContains:
          path: rules[*].resources
          content: infrastructures
      - notContains:
          path: rules[?(@.apiGroups[0] == "")].resources
          content: "*"
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [persistentvolumeclaims]
            verbs: [get, list, watch, patch]
  - it: appends complete custom rules with restricted discovery
    set:
      insights.clusterRole.fullRO: false
      insights.clusterRole.extraRules: &extras
        - apiGroups: [example.com]
          resources: [widgets, widgets/status]
          resourceNames: [selected-widget]
          verbs: [get, patch]
        - nonResourceURLs: [/healthz]
          verbs: [get]
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [example.com]
            resources: [widgets, widgets/status]
            resourceNames: [selected-widget]
            verbs: [get, patch]
      - contains:
          path: rules
          content:
            nonResourceURLs: [/healthz]
            verbs: [get]
      - contains:
          path: rules
          content:
            apiGroups: [""]
            resources: [pods/log]
            verbs: [get]
  - it: retains extensions with explicit wildcard discovery
    set:
      insights.clusterRole.fullRO: true
      insights.clusterRole.extraRules: *extras
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["*"]
            resources: ["*"]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [example.com]
            resources: [widgets, widgets/status]
            resourceNames: [selected-widget]
            verbs: [get, patch]
  - it: accepts null extensions without broadening discovery
    set:
      insights.clusterRole.extraRules: null
    asserts: *restricted
