suite: Required resource and pod labels
templates:
  - templates/secret.yaml
  - templates/deployment-manager.yaml
  - templates/roleBinding.yaml
  - templates/clusterRoleBinding.yaml
  - templates/monitoring/cluster_role_binding.yaml
  - templates/monitoring/service_account.yaml
  - templates/monitoring/cronjob.yaml
  - templates/monitoring/cluster_role.yaml
  - templates/configMap.yaml
  - templates/serviceAccount.yaml
  - templates/clusterRole.yaml
  - templates/service.yaml
  - templates/role.yaml
  - templates/deployment.yaml

tests:
  - it: labels every rendered native resource
    set:
      global.cxLogging.enabled: true
    documentSelector:
      path: kind
      matchMany: true
      skipEmptyTemplates: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kompass

  - it: labels the deployment and pod without changing its selector
    templates:
      - templates/deployment.yaml
      - templates/configMap.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
        template: templates/deployment.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
        template: templates/deployment.yaml
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/part-of"]
        template: templates/deployment.yaml
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: kompass-insights
            app.kubernetes.io/name: kompass-insights
        template: templates/deployment.yaml

  - it: keeps Manager outside Insights selectors with overridden names and required labels
    templates:
      - templates/deployment-manager.yaml
    set:
      manager.hostNetwork: true
      fullnameOverride: custom-insights
      insights.podLabels:
        app.kubernetes.io/part-of: other
    asserts:
      - equal:
          path: metadata.name
          value: custom-insights-manager
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: custom-insights-manager
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/instance: custom-insights
            app.kubernetes.io/name: custom-insights-manager
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: custom-insights-manager
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass

  - it: keeps the deployment pod label when configured labels conflict
    templates:
      - templates/deployment.yaml
      - templates/configMap.yaml
    set:
      global.podLabels:
        app.kubernetes.io/part-of: global-other
      insights.podLabels:
        app.kubernetes.io/part-of: component-other
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
        template: templates/deployment.yaml

  - it: labels the self-monitoring CronJob and pod when configured labels conflict
    templates:
      - templates/monitoring/cronjob.yaml
    set:
      global.cxLogging.enabled: true
      global.podLabels:
        app.kubernetes.io/part-of: global-other
      selfMonitoring.podLabels:
        app.kubernetes.io/part-of: component-other
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
