{{- $pvcName := include "zesty-k8s.pvcname" . -}}
{{- $existingPVC := lookup "v1" "PersistentVolumeClaim" .Release.Namespace $pvcName -}}
{{- $existingStorage := "" -}}
{{- if $existingPVC -}}
  {{- $existingStorage = $existingPVC.spec.resources.requests.storage -}}
{{- end -}}
{{- $pvcSpec := deepCopy .Values.persistence.spec -}}
{{/* A null class in an upgrade patch clears the API-assigned class, which is immutable. */}}
{{- if not (kindIs "string" $pvcSpec.storageClassName) -}}
  {{- if and $existingPVC (hasKey $existingPVC.spec "storageClassName") -}}
    {{- $_ := set $pvcSpec "storageClassName" $existingPVC.spec.storageClassName -}}
  {{- else -}}
    {{- $_ := unset $pvcSpec "storageClassName" -}}
  {{- end -}}
{{- end -}}
{{- $_ := set $pvcSpec.resources.requests "storage" ($existingStorage | default $pvcSpec.resources.requests.storage) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "{{ $pvcName }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
spec:
  {{- toYaml $pvcSpec | nindent 2 }}
