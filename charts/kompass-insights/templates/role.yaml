apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "zesty-k8s.role" . }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - "{{ .Values.insights.secret }}"
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - patch
      - update
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      - {{ .Values.global.license.secretName | quote }}
    verbs: ["update"]
  # Kubernetes cannot restrict Secret creation by resourceNames.
  - apiGroups: [""]
    resources: [secrets]
    verbs: ["create"]
{{- if .Values.pvcExpansion.enabled }}
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs: ["get", "list", "watch", "patch", "update"]
{{- end }}
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch"]
