{{- include "zesty-k8s.validate.managerRepository" . -}}
{{- $globalWorkload := .Values.global | default dict -}}
{{- $insightsWorkload := .Values.insights | default dict -}}
{{- $insightsAnnotations := include "zesty-k8s.workload.mergeMaps" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "annotations"
  "fallback" (.Values.insights.annotations | default dict)
) | fromYaml -}}
{{- $insightsCeilings := pick (dig "guardian" "requestCeilings" "insights" (dict) .Values.global) "kompass-insights" "manager" -}}
{{- if .Values.manager.hostNetwork -}}
{{- $_ := unset $insightsCeilings "manager" -}}
{{- end -}}
{{- $insightsContainerName := include "zesty-k8s.name" . -}}
{{- if and (hasKey $insightsCeilings "kompass-insights") (ne $insightsContainerName "kompass-insights") -}}
{{- $insightsPrimaryCeiling := get $insightsCeilings "kompass-insights" -}}
{{- $_ := unset $insightsCeilings "kompass-insights" -}}
{{- $_ := set $insightsCeilings $insightsContainerName $insightsPrimaryCeiling -}}
{{- end -}}
{{- if $insightsCeilings -}}
{{- $insightsAnnotations = mergeOverwrite $insightsAnnotations (dict "guardian.kompass.zesty.co/request-ceilings" (printf "{\"version\":1,\"containers\":%s}" ($insightsCeilings | toJson))) -}}
{{- end -}}
{{- $insightsPodAnnotations := include "zesty-k8s.workload.mergeMaps" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "podAnnotations"
  "fallback" (.Values.insights.podAnnotations | default dict)
) | fromYaml -}}
{{- $insightsPodLabels := include "zesty-k8s.workload.mergeMaps" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "podLabels"
  "fallback" (.Values.insights.podLabels | default dict)
) | fromYaml -}}
{{- $insightsPodLabels = mergeOverwrite ($insightsPodLabels | default dict) (include "zesty-k8s.requiredLabels" . | fromYaml) -}}
{{- $insightsResolvedPodSecurityContext := mergeOverwrite
  (mergeOverwrite
    (deepCopy (.Values.securityContext | default dict))
    ((get $insightsWorkload "podSecurityContext") | default dict)
  )
  ((get $globalWorkload "podSecurityContext") | default dict)
-}}
{{- $insightsResolvedSecurityContext := mergeOverwrite
  (mergeOverwrite
    (deepCopy (.Values.container.securityContext | default dict))
    ((get $insightsWorkload "securityContext") | default dict)
  )
  ((get $globalWorkload "securityContext") | default dict)
-}}
{{- include "zesty-k8s.workload.validateContainerSecurityContext" (dict
  "context" $insightsResolvedSecurityContext
  "path" "insights.securityContext"
) -}}
{{- $insightsLegacyPodSecurityContext := include "zesty-k8s.workload.extractPodSecurityContext" (dict
  "context" $insightsResolvedSecurityContext
  "path" "insights.securityContext"
) | fromYaml -}}
{{- $insightsContainerSecurityContext := include "zesty-k8s.workload.extractContainerSecurityContext" (dict
  "context" $insightsResolvedSecurityContext
  "path" "insights.securityContext"
) | fromYaml -}}
{{- $insightsPodSecurityContext := mergeOverwrite (deepCopy ($insightsLegacyPodSecurityContext | default dict)) ($insightsResolvedPodSecurityContext | default dict) -}}
{{- $insightsAffinity := include "zesty-k8s.workload.mergeMaps" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "affinity"
) | fromYaml -}}
{{- $insightsImagePullSecrets := include "zesty-k8s.workload.resolveImagePullSecrets" (dict
  "root" .
  "global" $globalWorkload
  "component" $insightsWorkload
) | fromYamlArray -}}
{{- $insightsTopologySpreadConstraints := include "zesty-k8s.workload.resolveListWithGlobalPrecedence" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "topologySpreadConstraints"
) | fromYamlArray -}}
{{- $insightsAutomountSAToken := include "zesty-k8s.workload.resolveBool" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "automountServiceAccountToken"
  "fallback" true
) | trim -}}
{{- $insightsRuntimeClassName := include "zesty-k8s.workload.resolveString" (dict
  "global" $globalWorkload
  "component" $insightsWorkload
  "key" "runtimeClassName"
  "fallback" ""
) | trim -}}
{{- $reservedLicenseEnvNames := list "LICENSE_SECRET_NAME" "LICENSE_DOCUMENT_KEY" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include "zesty-k8s.fullname" . }}"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
  {{- with $insightsAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
      app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configMap.yaml") . | sha256sum }}
        {{- with $insightsPodAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
        app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
        {{- with $insightsPodLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if $insightsImagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $insightsImagePullSecrets | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ $insightsAutomountSAToken }}
      {{- if $insightsRuntimeClassName }}
      runtimeClassName: {{ $insightsRuntimeClassName | quote }}
      {{- end }}
      {{- if .Values.global.nodeSelector }}
      nodeSelector:
      {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.global.tolerations }}
      tolerations:
      {{- toYaml .Values.global.tolerations | nindent 8 }}
      {{- end }}
      {{- with $insightsAffinity }}
      affinity:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $insightsTopologySpreadConstraints }}
      topologySpreadConstraints:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - image: "{{ .Values.image.repository }}:{{ include "zesty-k8s.version" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: "{{ include "zesty-k8s.name" . }}"
          ports:
            - name: healthz
              containerPort: {{ .Values.insights.health.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.insights.metrics.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.insights.grpc.server.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.insights.health.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.insights.health.port }}
            initialDelaySeconds: 90
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.insights.health.port }}
            periodSeconds: 5
            failureThreshold: 18
            timeoutSeconds: 1
          {{- $resources := .Values.resources }}
          {{- if .Values.global.guardian.enabled }}
          {{- $resources = .Values.guardianProtectedResources }}
          {{- end }}
          {{- with $resources }}
          resources:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $insightsContainerSecurityContext }}
          securityContext:
          {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: "{{ include "zesty-k8s.configmap" . }}"
          env:
            - name: MANAGER_ENABLED
              value: "true"
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CONTAINER_NAME
              value: {{ include "zesty-k8s.name" . }}
            {{- range .Values.insights.extraEnv }}
              {{- if not (has .name (append $reservedLicenseEnvNames "MANAGER_ENABLED")) }}
              {{- toYaml (list .) | nindent 12 }}
              {{- end }}
            {{- end }}
            {{- include "zesty-k8s.controller.coralogix.envs" . | nindent 12 }}
            - name: KOMPASS_RELEASE
              value: {{ .Release.Name }}
            - name: KOMPASS_CHART_VERSION
              valueFrom:
                configMapKeyRef:
                  name: "{{ include "zesty-k8s.globalConfig" .}}"
                  key: kompass_chart_version
            - name: INSIGHTS_CHART_VERSION
              value: {{ .Chart.Version }}
            - name: LICENSE_SECRET_NAME
              value: {{ .Values.global.license.secretName | quote }}
            - name: LICENSE_DOCUMENT_KEY
              value: {{ .Values.global.license.documentKey | quote }}
        {{- if not .Values.manager.hostNetwork }}
        {{- include "zesty-k8s.manager.container" . | nindent 8 }}
        {{- end }}
      priorityClassName: system-cluster-critical
      {{- with $insightsPodSecurityContext }}
      securityContext:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: "{{ include "zesty-k8s.serviceAccountName" . }}"
      shareProcessNamespace: true
      {{- if not .Values.manager.hostNetwork }}
      volumes:
        - name: manager-health
          emptyDir: {}
        {{- with .Values.manager.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
