{{- if .Capabilities.APIVersions.Has "config.openshift.io/v1/Infrastructure" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "zesty-k8s.fullname" . }}-rosa-metadata"
  namespace: openshift-cluster-csi-drivers
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - "secrets"
    resourceNames:
      - "ebs-cloud-credentials"
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "zesty-k8s.fullname" . }}-rosa-metadata"
  namespace: openshift-cluster-csi-drivers
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "zesty-k8s.fullname" . }}-rosa-metadata"
subjects:
  - kind: ServiceAccount
    name: "{{ include "zesty-k8s.serviceAccountName" . }}"
    namespace: "{{ .Release.Namespace }}"
{{- end }}
