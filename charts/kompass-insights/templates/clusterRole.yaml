apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: "{{ include "zesty-k8s.clusterrole" . }}"
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
rules:
  {{- if .Capabilities.APIVersions.Has "config.openshift.io/v1/Infrastructure" }}
  # Read the ROSA cluster name from the named OpenShift Infrastructure object.
  - apiGroups:
      - "config.openshift.io"
    resources:
      - "infrastructures"
    resourceNames:
      - "cluster"
    verbs: ["get"]
  {{- end }}
  # Write permissions.
  - apiGroups:
      - "rightsizing.kompass.zesty.co"
      - "horizontalscaling.kompass.zesty.co"
      - "kompass.zesty.co"
      - "zesty.co"
    resources:
      - "*"
    verbs: ["*"]
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  {{- if .Values.insights.clusterRole.fullRO }}
  # fullRO=true. Full read-only discovery for building ownerReference maps.
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs: ["get", "list", "watch"]
  {{- end }}
  # fullRO=false. Explicit resource coverage instead of wildcard read-only discovery.
  - apiGroups:
      - "argoproj.io"
    resources:
      - workflows
      - workflowtemplates
      - clusterworkflowtemplates
      - cronworkflows
      - rollouts
      - analysistemplates
      - experiments
      - analysisruns
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "kafka.strimzi.io"
    resources:
      - kafkas
      - kafkatopics
      - kafkausers
      - kafkaconnects
      - kafkaconnectors
      - kafkamirrormakers
      - kafkamirrormaker2s
      - kafkarebalances
      - kafkabridges
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "core.strimzi.io"
    resources:
      - strimzipodsets
      - strimzipodsets/status
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "clickhouse.altinity.com"
    resources:
      - clickhouseinstallations
      - clickhouseinstallationtemplates
      - clickhouseoperatorconfigurations
      - clickhousekeeperinstallations
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "cloudwatch.aws.amazon.com"
    resources:
      - amazoncloudwatchagents
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "flink.apache.org"
    resources:
      - flinkdeployments
      - flinksessionjobs
      - flinkstatesnapshots
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "monitoring.coreos.com"
    resources:
      - alertmanagers
      - podmonitors
      - probes
      - prometheuses
      - prometheusrules
      - servicemonitors
      - thanosrulers
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "actions.github.com"
    resources:
      - autoscalinglisteners
      - autoscalingrunnersets
      - workflowruns
      - runnerdeployments
      - runners
      - runnersets
      - workflows
      - ephemeralrunners
      - ephemeralrunnersets
      - horizontalrunnerautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - ""
    resources:
      - events
      - namespaces
      - nodes
      - persistentvolumes
      - pods
      - replicationcontrollers
      - services
      - endpoints
      - nodes/proxy
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs: ["get"]
  - apiGroups:
      - "metrics.k8s.io"
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - batch
    resources:
      - cronjobs
      - jobs
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "storage.k8s.io"
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "karpenter.sh"
    resources:
      - nodepools
      - nodeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "karpenter.k8s.aws"
    resources:
      - ec2nodeclasses
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "keda.sh"
    resources:
      - scaledjobs
      - scaledobjects
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - "apiextensions.k8s.io"
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - mutatingwebhookconfigurations
      - validatingwebhookconfigurations
    verbs: ["get", "list", "watch"]
