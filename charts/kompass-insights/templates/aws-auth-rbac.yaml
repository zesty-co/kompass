apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: "{{ include "zesty-k8s.fullname" . }}-aws-auth"
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    resourceNames:
      - aws-auth
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ include "zesty-k8s.fullname" . }}-aws-auth"
  namespace: kube-system
  labels:
    app.kubernetes.io/instance: "{{ include "zesty-k8s.fullname" . }}"
    app.kubernetes.io/name: "{{ include "zesty-k8s.fullname" . }}"
    {{- include "zesty-k8s.requiredLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: "{{ include "zesty-k8s.fullname" . }}-aws-auth"
subjects:
  - kind: ServiceAccount
    name: "{{ include "zesty-k8s.serviceAccountName" . }}"
    namespace: "{{ .Release.Namespace }}"
