suite: Required resource and pod labels
templates:
  - templates/serviceaccount.yaml
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml
  - templates/role.yaml
  - templates/rolebinding.yaml
  - templates/service.yaml
  - templates/deployment.yaml
  - templates/poddisruptionbudget.yaml
  - templates/hpa.yaml
  - templates/certificate.yaml
  - templates/mutatingwebhook.yaml

tests:
  - it: labels every rendered resource
    set:
      enabled: true
      autoscaling.enabled: true
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kompass

  - it: labels the deployment and pod without changing its selector
    templates:
      - templates/deployment.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
      - notExists:
          path: spec.selector.matchLabels["app.kubernetes.io/part-of"]

  - it: keeps the required pod label when configured pod labels conflict
    templates:
      - templates/deployment.yaml
    set:
      podLabels:
        app.kubernetes.io/part-of: other
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/part-of"]
          value: kompass
