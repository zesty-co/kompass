{{- if or (and .Values.global.cxLogging .Values.global.cxLogging.enabled) .Values.cxLogging.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-exporter-role
rules:
- apiGroups:
  - ""
  resources:
  - "nodes/proxy"
  verbs:
  - "get"
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-exporter-secret-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups: [apps]
  resources: [deployments, statefulsets, daemonsets]
  verbs: [list]
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [kompass-insights-secret]
  verbs: [get, list, watch]
{{- end }}
