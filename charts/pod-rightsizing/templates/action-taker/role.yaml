---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kompass-rightsizing-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  - namespaces
  - pods
  verbs:
  - get
  - list
  - watch
{{- if eq (.Values.global.readScope | default "cluster") "cluster" }}
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
{{- end }}
{{- range $kind := .Values.global.supportedKinds }}
{{- $resource := $kind.Resource | default (printf "%ss" ($kind.Kind | lower)) }}
- apiGroups: [{{ $kind.Group | default "" | quote }}]
  resources: [{{ $resource | quote }}]
  verbs: [get, list, watch{{ if $.Values.enabled }}, patch, update{{ end }}]
{{- end }}
{{- range $kind := .Values.global.additionalSupportedKinds }}
{{- $resource := $kind.Resource | default (printf "%ss" ($kind.Kind | lower)) }}
- apiGroups: [{{ $kind.Group | default "" | quote }}]
  resources: [{{ $resource | quote }}]
  verbs: [get, list, watch{{ if $.Values.enabled }}, patch, update{{ end }}]
{{- end }}
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
{{- if .Values.enabled }}
  - patch
  - update
{{- end }}
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
{{- if .Values.enabled }}
  - patch
  - update
{{- end }}
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
- apiGroups:
  - horizontalscaling.kompass.zesty.co
  resources:
  - policies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - horizontalscaling.kompass.zesty.co
  resources:
  - policies/finalizers
  verbs:
  - delete
  - patch
  - update
- apiGroups:
  - horizontalscaling.kompass.zesty.co
  resources:
  - policies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - keda.sh
  resources:
  - scaledobjects
  verbs:
  - get
  - list
{{- if .Values.enabled }}
  - patch
  - update
{{- end }}
  - watch
- apiGroups:
  - kompass.zesty.co
  resources:
  - clustervirtualworkloads
  - virtualworkloads
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - kompass.zesty.co
  resources:
  - clustervirtualworkloads/finalizers
  - virtualworkloads/finalizers
  verbs:
  - update
- apiGroups:
  - kompass.zesty.co
  resources:
  - clustervirtualworkloads/status
  - virtualworkloads/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - rightsizing.kompass.zesty.co
  resources:
  - actions
  - clusteractions
  - initialvalues
  - policies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rightsizing.kompass.zesty.co
  resources:
  - actions/finalizers
  - clusteractions/finalizers
  - policies/finalizers
  verbs:
  - delete
  - patch
  - update
- apiGroups:
  - rightsizing.kompass.zesty.co
  resources:
  - actions/status
  - clusteractions/status
  - policies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - get
  - list
  - watch
{{- if .Values.enabled }}
- apiGroups:
  - ""
  resources:
  - pods/resize
  verbs:
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods/eviction
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kompass-rightsizing-cm-manager-role
  namespace: {{ .Release.Namespace }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
