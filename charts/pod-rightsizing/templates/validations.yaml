{{- if and .Values.config.kompassWorkloadsRightsizing.enabled (ne (include "pod-rightsizing.guardian.enabled" .) "true") -}}
{{- fail "config.kompassWorkloadsRightsizing.enabled=true requires global.guardian.enabled=true" -}}
{{- end -}}
{{- if and .Values.jvmRightsizingEnabled (not (.Values.jvmMetrics.enabled | default false)) -}}
{{- fail "jvmRightsizingEnabled=true requires jvmMetrics.enabled=true" -}}
{{- end -}}
{{- include "pod-rightsizing.validate.guardianRequestCeilings" . -}}

{{- range $index, $kind := .Values.additionalSupportedKinds -}}
{{- $properties := $kind.Properties -}}
{{- if and (hasKey $kind "Properties") (not (kindIs "invalid" $properties)) (not (kindIs "slice" $properties)) -}}
{{- fail (printf "additionalSupportedKinds[%d].Properties must be an array" $index) -}}
{{- end -}}
{{- range $property := $properties -}}
{{- if not (has $property (list "Virtual" "Standalone")) -}}
{{- fail (printf "additionalSupportedKinds[%d].Properties contains unsupported property \"%v\": allowed properties are Virtual and Standalone" $index $property) -}}
{{- end -}}
{{- end -}}
{{- end -}}
