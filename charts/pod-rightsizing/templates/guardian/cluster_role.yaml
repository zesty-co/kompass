{{- if .Values.guardian.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kompass-guardian-cluster-role
  labels:
    app.kubernetes.io/component: guardian
    {{- include "pod-rightsizing.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
  - apiGroups: ["kompass.zesty.co"]
    resources: ["clustervirtualworkloads"]
    verbs: ["get", "list", "watch"]
{{- end }}
