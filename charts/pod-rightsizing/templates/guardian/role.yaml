{{- if .Values.guardian.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kompass-guardian-role
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: guardian
    {{- include "pod-rightsizing.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "update", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kompass-insights-secret"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames:
      - kompass-guardian-leader-election
      - recommendation-maker-lock
      - action-taker-lock
    verbs: ["get", "update"]
  - apiGroups: ["rightsizing.kompass.zesty.co"]
    resources: ["actions"]
    verbs: ["get", "update"]
  - apiGroups: ["rightsizing.kompass.zesty.co"]
    resources: ["actions/status"]
    verbs: ["update"]
  # Guardian resolves arbitrary namespaced OwnerReference chains directly from
  # the API. Every Guardian write remains explicitly constrained above.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get"]
{{- end }}
