{{- if .Values.guardian.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kompass-guardian-cluster-role
  labels:
    app.kubernetes.io/component: guardian
    {{- include "pod-rightsizing.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kompass-guardian-cluster-role
subjects:
  - kind: ServiceAccount
    name: {{ include "pod-rightsizing.guardianServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
