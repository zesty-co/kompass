{{- if .Values.guardian.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kompass-guardian-config.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: guardian
    {{- include "pod-rightsizing.labels" . | nindent 4 }}
data:
  cadvisorScrapeInterval: "15s"
  cadvisorMaxConcurrentScrapes: "4"
  cpuThrottlingRatio: "0.5"
  cpuThrottlingRate: "0.1"
  cpuThrottlingConsecutiveWindows: "4"
  cpuRequestGrowthFactor: "1.5"
  memoryRequestGrowthFactor: "1.5"
  cpuRequestToLimitFactor: "1.25"
  memoryRequestToLimitFactor: "1.25"
  stabilizationWindow: "10m"
  recoveryApplyTimeout: "5m"
{{- end }}
