gpuMetrics:
  enabled: false
  dcgmExporter:
    # Labels used to discover the customer-managed DCGM Exporter pods.
    podSelector:
      - label: app.kubernetes.io/name
        value: dcgm-exporter
      - label: app.kubernetes.io/component
        value: dcgm-exporter
    # Name of the container port that exposes DCGM metrics.
    metricsPortName: metrics
  runtimeClassName: ""
  imagePullSecrets: []
  podLabels: {}
  podAnnotations: {}
  workloadLabels: {}
  affinity: {}
  topologySpreadConstraints: []
  # Pod-level security context applied to the GPU pod NVML exporter pod.
  # The exporter uses runAsNonRoot and RuntimeDefault seccomp by default.
  podSecurityContext: {}
  # Example:
  # podSecurityContext:
  #   fsGroup: 2000
  # Container-level security context applied to the GPU pod NVML exporter.
  # The exporter drops all capabilities, prevents privilege escalation, uses a
  # read-only root filesystem, and runs as non-root UID 65532 by default.
  securityContext: {}
  # Example:
  # securityContext:
  #   runAsUser: 2000
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 96Mi
