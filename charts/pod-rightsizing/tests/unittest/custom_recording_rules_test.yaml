suite: CustomRecordingRulesConfigMap
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/config/custom-recording-rules.yaml
tests:
  - it: does not add an exporter presence recording rule
    set:
      jvmRightsizingEnabled: false
      jvmMetrics:
        enabled: true
    asserts:
      - isNull:
          path: data["rightsizing.yaml"]
      - isNull:
          path: data["jvm-exporter-presence.yaml"]
  - it: renders JVM recording rules when rightsizing is enabled with JVM metrics enabled
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: kompass-vm-rightsizing-recording-rules
      - matchRegex:
          path: data["rightsizing.yaml"]
          pattern: 'kompass_container_jvm_heap_usage_max'
      - matchRegex:
          path: data["rightsizing.yaml"]
          pattern: 'kompass_container_jvm_heap_initial_max'
      - matchRegex:
          path: data["rightsizing.yaml"]
          pattern: 'kompass_container_jvm_gc_time_ratio_max'
      - matchRegex:
          path: data["rightsizing.yaml"]
          pattern: 'kompass_container_jvm_max_heap_max'
      - matchRegex:
          path: data["rightsizing.yaml"]
          pattern: 'kompass_container_jvm_memory_minus_heap_usage_max'
