suite: JvmScrapeConfig
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/config/custom-scrape.yaml
tests:
  - it: fails when jvmMetrics is enabled without scrapeConfigs or auto-discovery
    set:
      jvmMetrics:
        enabled: true
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs must be defined when jvmMetrics.autoDiscovery.enabled is false

  - it: fails when scrapeConfig has no labels or annotations
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - path: /metrics
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0] must define labels or annotations

  - it: fails when namespaces is empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespaces: []
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].namespaces cannot be empty

  - it: fails when namespaces is not a list
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespaces: java-test
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].namespaces must be a list

  - it: fails when namespacesToExclude is empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespacesToExclude: []
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].namespacesToExclude cannot be empty

  - it: fails when namespacesToExclude is not a list
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespacesToExclude: kube-system
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].namespacesToExclude must be a list

  - it: fails when namespaces and namespacesToExclude are both set
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespaces:
              - java-test
            namespacesToExclude:
              - kube-system
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0] cannot set both namespaces and namespacesToExclude

  - it: fails when scrapeInterval is empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            scrapeInterval: ""
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].scrapeInterval cannot be empty

  - it: fails when path is empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            path: ""
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].path cannot be empty

  - it: fails when scheme is empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            scheme: ""
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].scheme cannot be empty

  - it: fails when scheme is not http or https
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            scheme: ftp
    asserts:
      - failedTemplate:
          errorMessage: jvmMetrics.scrapeConfigs[0].scheme must be either http or https

  - it: renders valid JVM scrape config
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
            namespaces:
              - java-test
            scrapeInterval: 30s
            path: /metrics
            scheme: https
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'job_name: jvm-job-1'
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'scrape_interval: 30s'
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'metrics_path: /metrics'
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'scheme: https'
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'names:\n\s+- "java-test"'

  - it: renders auto-discovery annotation selector when JVM metrics and auto-discovery are enabled
    set:
      jvmMetrics:
        enabled: true
        autoDiscovery:
          enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '__meta_kubernetes_pod_annotation_kompass_zesty_co_jvm_auto_discovered'
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'regex: "\(true\)"'
      - notMatchRegex:
          path: data["jvm.yaml"]
          pattern: 'source_labels: \[__meta_kubernetes_pod_container_port_number\]'
