suite: Guardian request-ceiling installation validation
templates:
  - templates/validations.yaml
tests:
  - it: accepts complete global Guardian ceilings
    asserts:
      - notFailedTemplate: {}

  - it: rejects an empty CPU request
    set:
      global:
        guardian:
          requestCeilings:
            actionTaker:
              kube-rbac-proxy:
                cpuRequest: ""
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.actionTaker.kube-rbac-proxy.cpuRequest is required

  - it: rejects a missing memory request
    set:
      global:
        guardian:
          requestCeilings:
            recommendationsMaker:
              recommendations-maker:
                memoryRequest: null
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.recommendationsMaker.recommendations-maker.memoryRequest is required

  - it: rejects a missing container
    set:
      global:
        guardian:
          requestCeilings:
            actionTaker:
              kube-rbac-proxy: null
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.actionTaker.kube-rbac-proxy is required

  - it: rejects a missing workload
    set:
      global:
        guardian:
          requestCeilings:
            gpuMetrics: null
    asserts:
      - failedTemplate:
          errorMessage: global.guardian.requestCeilings.gpuMetrics is required
