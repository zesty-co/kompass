suite: BridgeActor
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/action-taker/action-taker.yaml
  - templates/action-taker/action-taker-service.yaml
  - templates/config/pilotConfigmap.yaml
  - templates/recommendations-maker/recommendations-maker.yaml
tests:
  - it: renders default bridge actor port for action-taker
    template: templates/action-taker/action-taker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            containerPort: 50051
            name: bridge-actor
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: BRIDGE_ACTOR_PORT
            value: "50051"

  - it: exposes the action-taker bridge actor through the service
    template: templates/action-taker/action-taker-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: kompass-rightsizing-action-taker-svc
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/component: action-taker
      - contains:
          path: spec.ports
          content:
            name: bridge-actor
            port: 50051
            targetPort: bridge-actor
            protocol: TCP
      - equal:
          path: spec.type
          value: ClusterIP

  - it: renders default bridge actor port for recommendations-maker
    template: templates/recommendations-maker/recommendations-maker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 50051
            name: bridge-actor
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRIDGE_ACTOR_PORT
            value: "50051"

  - it: renders overridden bridge actor port for action-taker
    template: templates/action-taker/action-taker.yaml
    set:
      bridgeActor:
        port: 50053
    asserts:
      - contains:
          path: spec.template.spec.containers[1].ports
          content:
            containerPort: 50053
            name: bridge-actor
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: BRIDGE_ACTOR_PORT
            value: "50053"

  - it: renders overridden bridge actor port for recommendations-maker
    template: templates/recommendations-maker/recommendations-maker.yaml
    set:
      bridgeActor:
        port: 50053
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            containerPort: 50053
            name: bridge-actor
            protocol: TCP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BRIDGE_ACTOR_PORT
            value: "50053"
