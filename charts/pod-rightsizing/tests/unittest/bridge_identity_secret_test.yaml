suite: BridgeIdentitySecret
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/action-taker/action-taker.yaml
  - templates/config/pilotConfigmap.yaml
  - templates/recommendations-maker/recommendations-maker.yaml
tests:
  - it: reads bridge identity from the default secret for action-taker
    template: templates/action-taker/action-taker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: ORG_ID
            valueFrom:
              secretKeyRef:
                name: kompass-insights-secret
                key: ORG_ID
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: CLUSTER_ID
            valueFrom:
              secretKeyRef:
                name: kompass-insights-secret
                key: CLUSTER_ID

  - it: reads bridge identity from the default secret for recommendations-maker
    template: templates/recommendations-maker/recommendations-maker.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ORG_ID
            valueFrom:
              secretKeyRef:
                name: kompass-insights-secret
                key: ORG_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_ID
            valueFrom:
              secretKeyRef:
                name: kompass-insights-secret
                key: CLUSTER_ID

  - it: supports an overridden identity secret for action-taker
    template: templates/action-taker/action-taker.yaml
    set:
      bridgeActor:
        identitySecretName: custom-identity
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: ORG_ID
            valueFrom:
              secretKeyRef:
                name: custom-identity
                key: ORG_ID

  - it: supports an overridden identity secret for recommendations-maker
    template: templates/recommendations-maker/recommendations-maker.yaml
    set:
      bridgeActor:
        identitySecretName: custom-identity
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_ID
            valueFrom:
              secretKeyRef:
                name: custom-identity
                key: CLUSTER_ID
