suite: Global supported kinds contract
templates:
  - templates/action-taker/role.yaml
  - templates/recommendations-maker/secret.yaml
  - templates/validations.yaml
values:
  - ../render/fixtures/guardian-request-ceilings-values.yaml
tests:
  - it: grants RBAC from global values and does not copy extension catalog into aggregation secret
    template: templates/action-taker/role.yaml
    documentIndex: 0
    set:
      global.supportedKinds:
        - Group: example.io
          Version: v1
          Kind: Widget
          Alias: widget
      global.additionalSupportedKinds:
        - Group: extension.io
          Version: v2
          Kind: Gadget
          Alias: gadget
          Resource: gadgets
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [example.io]
            resources: [widgets]
            verbs: [get, list, watch]
      - contains:
          path: rules
          content:
            apiGroups: [extension.io]
            resources: [gadgets]
            verbs: [get, list, watch]
  - it: keeps aggregation configuration and excludes extension payload from rightsizing secret
    template: templates/recommendations-maker/secret.yaml
    asserts:
      - isNotNull:
          path: stringData.customReplicaAggregationMethods
      - isNull:
          path: stringData.additionalSupportedKinds
  - it: accepts an explicit empty extensions list
    template: templates/validations.yaml
    set:
      global.additionalSupportedKinds: []
    asserts:
      - notFailedTemplate: {}
  - it: accepts builtin properties used by the parent catalog
    template: templates/validations.yaml
    set:
      global.supportedKinds:
        - Group: apps
          Version: v1
          Kind: Deployment
          Alias: deployment
          Properties: [Native, Standalone, Virtual, Builtin]
    asserts:
      - notFailedTemplate: {}
