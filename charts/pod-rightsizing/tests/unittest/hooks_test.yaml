suite: Hooks
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/hooks/pre-upgrade-create-crds-configmap.yaml
  - templates/hooks/pre-upgrade-apply-crds.yaml
tests:
  - it: renders pre-upgrade CRD ConfigMap with all seven expected payload keys
    template: templates/hooks/pre-upgrade-create-crds-configmap.yaml
    values:
      - ../render/fixtures/enabled-values.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - exists:
          path: data["kompass.zesty.co_clustervirtualworkloads.yaml"]
      - exists:
          path: data["kompass.zesty.co_virtualworkloads.yaml"]
      - exists:
          path: data["rightsizing.kompass.zesty.co_actions.yaml"]
      - exists:
          path: data["rightsizing.kompass.zesty.co_clusteractions.yaml"]
      - exists:
          path: data["rightsizing.kompass.zesty.co_policies.yaml"]
      - exists:
          path: data["horizontalscaling.kompass.zesty.co_policies.yaml"]
      - exists:
          path: data["rightsizing.kompass.zesty.co_initialvalues.yaml"]

  - it: renders pre-upgrade apply hook command with waits for all CRDs
    template: templates/hooks/pre-upgrade-apply-crds.yaml
    values:
      - ../render/fixtures/enabled-values.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/virtualworkloads\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/clustervirtualworkloads\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/actions\.rightsizing\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/clusteractions\.rightsizing\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/policies\.rightsizing\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/policies\.horizontalscaling\.kompass\.zesty\.co
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: crd/initialvalues\.rightsizing\.kompass\.zesty\.co
