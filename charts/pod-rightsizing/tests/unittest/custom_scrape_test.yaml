suite: CustomScrapeConfigMap
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/config/custom-scrape.yaml
tests:
  - it: does not render custom scrape ConfigMap when all custom scrape files are empty
    asserts:
      - containsDocument:
          kind: ConfigMap
          name: kompass-vmagent-rightsizing-custom-scrape-config
        not: true

  - it: renders custom scrape ConfigMap when a custom scrape file is non-empty
    set:
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - annotations:
              a: a
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: kompass-vmagent-rightsizing-custom-scrape-config
      - equal:
          path: metadata.namespace
          value: zesty-system
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'job_name: jvm-job-1'

  - it: renders the GPU scrape jobs when GPU metrics are enabled
    set:
      gpuMetrics:
        enabled: true
    asserts:
      - isKind:
          of: ConfigMap
      - notMatchRegex:
          path: data["gpu.yaml"]
          pattern: 'cuda-telemetry|cuda-metrics'
      - notMatchRegex:
          path: data["gpu.yaml"]
          pattern: 'vllm-openai|gpu-burner|__meta_kubernetes_namespace.*__meta_kubernetes_pod_label_app'
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: 'job_name: dcgm-exporter'
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: 'job_name: gpu-pod-nvml-exporter'
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: '__meta_kubernetes_pod_label_app_kubernetes_io_component'

  - it: renders a custom DCGM pod selector and metrics port name
    set:
      gpuMetrics:
        enabled: true
        dcgmExporter:
          podSelector:
            - label: app
              value: nvidia-dcgm-exporter
          metricsPortName: http-metrics
    asserts:
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: '__meta_kubernetes_pod_label_app'
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: 'regex: "nvidia-dcgm-exporter"'
      - matchRegex:
          path: data["gpu.yaml"]
          pattern: 'regex: "http-metrics"'
      - notMatchRegex:
          path: data["gpu.yaml"]
          pattern: '__meta_kubernetes_pod_label_app_kubernetes_io_name'
