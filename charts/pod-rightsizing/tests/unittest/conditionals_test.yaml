suite: Conditionals
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/webhook/validating-webhook.yaml
  - templates/webhook/mutating-webhook.yaml
  - templates/webhook/service.yaml
  - templates/webhook/certificate.yaml
  - templates/metrics-exporter/metrics-exporter.yaml
tests:
  - it: excludes webhooks and webhook service artifacts by default
    values:
      - ../render/fixtures/default-values.yaml
    asserts:
      - containsDocument:
          kind: ValidatingWebhookConfiguration
        not: true
      - containsDocument:
          kind: MutatingWebhookConfiguration
        not: true
      - containsDocument:
          kind: Service
          name: zesty-kompass-pod-rightsizing-webhook-service
        not: true
      - containsDocument:
          kind: Certificate
          name: kompass-pod-rightsizing-webhook-cert
        not: true

  - it: renders metrics-exporter workload when cxlogging is enabled
    template: templates/metrics-exporter/metrics-exporter.yaml
    values:
      - ../render/fixtures/cxlogging-on-values.yaml
    asserts:
      - isKind:
          of: CronJob
      - equal:
          path: metadata.name
          value: zesty-kompass-pod-rightsizing-metrics-exporter
