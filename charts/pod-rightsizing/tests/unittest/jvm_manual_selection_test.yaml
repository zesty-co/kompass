suite: JVM manual selection rules
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/config/jvmConfigmap.yaml
  - templates/config/custom-scrape.yaml
tests:
  - it: shares ordered customer selectors with vmagent and excludes the generated auto job
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: true
        autoDiscovery:
          enabled: true
        scrapeConfigs:
          - labels:
              app: api
              tier: backend
            annotations:
              scrape: "yes"
            namespaces:
              - prod
          - annotations:
              manual: "true"
            namespacesToExclude:
              - kube-system
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"annotations":{"scrape":"yes"},"labels":{"app":"api","tier":"backend"},"namespaces":["prod"],"sourceIndex":0},{"annotations":{"manual":"true"},"namespacesToExclude":["kube-system"],"sourceIndex":1}]'
        template: templates/config/jvmConfigmap.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'job_name: jvm-job-1'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'job_name: jvm-job-2'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'job_name: jvm-job-3'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '__meta_kubernetes_pod_label_app'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '__meta_kubernetes_pod_label_tier'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '__meta_kubernetes_pod_annotation_scrape'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '(?s)job_name: jvm-job-2.*__meta_kubernetes_pod_annotation_manual.*regex: "\(true\)"'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'names:\n\s+- "prod"'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'kube-system'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'regex: "\(api;backend;\.\*\)\|\(\.\*;\.\*;yes\)"'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: '__meta_kubernetes_pod_annotation_kompass_zesty_co_jvm_auto_discovered'
        template: templates/config/custom-scrape.yaml
      - notMatchRegex:
          path: data.jvmManualSelectionRules
          pattern: 'jvm-auto-discovered|jvm-job-3|autoDiscovery'
        template: templates/config/jvmConfigmap.yaml

  - it: serializes manual intent while JVM metrics are disabled
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: false
        scrapeConfigs:
          - annotations:
              customer-scrape: "true"
            namespaces:
              - application
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"annotations":{"customer-scrape":"true"},"namespaces":["application"],"sourceIndex":0}]'
        template: templates/config/jvmConfigmap.yaml

  - it: stringifies scalar selector values identically for vmagent and Action Taker
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - labels:
              version: 2
              enabled: true
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"labels":{"enabled":"true","version":"2"},"sourceIndex":0}]'
        template: templates/config/jvmConfigmap.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'regex: "\(true;2\)"'
        template: templates/config/custom-scrape.yaml

  - it: stringifies non-null namespace scalars identically and preserves null entries
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: true
        scrapeConfigs:
          - labels:
              app: api
            namespaces:
              - 7
              - true
          - annotations:
              scrape: "yes"
            namespacesToExclude:
              - 9
              - false
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"labels":{"app":"api"},"namespaces":["7","true"],"sourceIndex":0},{"annotations":{"scrape":"yes"},"namespacesToExclude":["9","false"],"sourceIndex":1}]'
        template: templates/config/jvmConfigmap.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'names:\n\s+- "7"\n\s+- "true"'
        template: templates/config/custom-scrape.yaml
      - matchRegex:
          path: data["jvm.yaml"]
          pattern: 'regex: "\^\(9\|false\)\$"'
        template: templates/config/custom-scrape.yaml

  - it: preserves null namespace elements for fail-closed Action Taker parsing
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: false
        scrapeConfigs:
          - labels:
              app: api
            namespaces:
              - null
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"labels":{"app":"api"},"namespaces":[null],"sourceIndex":0}]'
        template: templates/config/jvmConfigmap.yaml

  - it: preserves null selector values for fail-closed Action Taker parsing
    set:
      jvmRightsizingEnabled: true
      jvmMetrics:
        enabled: false
        scrapeConfigs:
          - labels:
              app: null
    asserts:
      - equal:
          path: data.jvmManualSelectionRules
          value: '[{"labels":{"app":null},"sourceIndex":0}]'
        template: templates/config/jvmConfigmap.yaml
