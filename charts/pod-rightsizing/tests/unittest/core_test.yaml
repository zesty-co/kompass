suite: CoreConfig
release:
  name: ci
  namespace: zesty-system
templates:
  - templates/action-taker/action-taker.yaml
  - templates/config/initial-values-cm.yaml
  - templates/config/pilotConfigmap.yaml
tests:
  - it: keeps initial-values ConfigMap after uninstall
    template: templates/config/initial-values-cm.yaml
    values:
      - ../render/fixtures/enabled-values.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.namespace
          value: zesty-system
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: includes default builtin policies
    template: templates/config/pilotConfigmap.yaml
    values:
      - ../render/fixtures/default-values.yaml
    asserts:
      - matchRegex:
          path: data.builtinPolicies
          pattern: (?m)^\s*-\s*balanced\s*$
      - matchRegex:
          path: data.builtinPolicies
          pattern: (?m)^\s*-\s*cost-focused\s*$
      - matchRegex:
          path: data.builtinPolicies
          pattern: (?m)^\s*-\s*stability-focused\s*$

  - it: includes default horizontal scaling builtin policies
    template: templates/config/pilotConfigmap.yaml
    values:
      - ../render/fixtures/default-values.yaml
    asserts:
      - matchRegex:
          path: data.horizontalScalingBuiltinPolicies
          pattern: (?m)^\s*-\s*balanced\s*$
      - matchRegex:
          path: data.horizontalScalingBuiltinPolicies
          pattern: (?m)^\s*-\s*cost-focused\s*$
      - matchRegex:
          path: data.horizontalScalingBuiltinPolicies
          pattern: (?m)^\s*-\s*stability-focused\s*$

  - it: includes default Kompass workloads rightsizing configuration
    template: templates/config/pilotConfigmap.yaml
    values:
      - ../render/fixtures/default-values.yaml
    asserts:
      - equal:
          path: data.kompassWorkloadsRightsizingEnabled
          value: "false"
      - equal:
          path: data.kompassWorkloadsRightsizingPolicyName
          value: stability-focused
      - matchRegex:
          path: data.kompassWorkloadsRightsizingExcludedWorkloads
          pattern: (?m)^\s*-\s*kind:\s*deployment\s*$
      - matchRegex:
          path: data.kompassWorkloadsRightsizingExcludedWorkloads
          pattern: (?m)^\s*name:\s*kompass-guardian\s*$

  - it: enables Kompass workloads rightsizing from values
    template: templates/config/pilotConfigmap.yaml
    set:
      config.kompassWorkloadsRightsizing.enabled: true
    asserts:
      - equal:
          path: data.kompassWorkloadsRightsizingEnabled
          value: "true"

  - it: renders JVM auto-discovery config into the rightsizing ConfigMap
    template: templates/config/pilotConfigmap.yaml
    set:
      jvmMetrics:
        enabled: true
        autoDiscovery:
          enabled: true
    asserts:
      - equal:
          path: data.jvmAutoDiscoveryEnabled
          value: "true"
      - equal:
          path: data.jvmAutoDiscoveryEnvSignals
          value: "JAVA_HOME,JAVA_OPTS,JAVA_TOOL_OPTIONS,JDK_JAVA_OPTIONS,MAVEN_HOME"
      - equal:
          path: data.jvmAutoDiscoveryCommandSignals
          value: "java,-jar,.jar,.war"
      - equal:
          path: data.jvmAutoDiscoveryImageSignals
          value: "openjdk,temurin,corretto,bitnami/java,kafka,jenkins/jenkins"

  - it: renders custom JVM auto-discovery signals into the rightsizing ConfigMap
    template: templates/config/pilotConfigmap.yaml
    set:
      jvmMetrics:
        enabled: true
        autoDiscovery:
          enabled: true
          envSignals:
            - CUSTOM_JAVA_ENV
          commandSignals:
            - java
            - .ear
          imageSignals:
            - jenkins/jenkins
            - custom-java
    asserts:
      - equal:
          path: data.jvmAutoDiscoveryEnabled
          value: "true"
      - equal:
          path: data.jvmAutoDiscoveryEnvSignals
          value: "CUSTOM_JAVA_ENV"
      - equal:
          path: data.jvmAutoDiscoveryCommandSignals
          value: "java,.ear"
      - equal:
          path: data.jvmAutoDiscoveryImageSignals
          value: "jenkins/jenkins,custom-java"

  - it: appends additional JVM auto-discovery signals to defaults
    template: templates/config/pilotConfigmap.yaml
    set:
      jvmMetrics:
        enabled: true
        autoDiscovery:
          enabled: true
          additionalEnvSignals:
            - KOTLIN_HOME
          additionalCommandSignals:
            - .kts
          additionalImageSignals:
            - custom-kotlin
    asserts:
      - equal:
          path: data.jvmAutoDiscoveryEnvSignals
          value: "JAVA_HOME,JAVA_OPTS,JAVA_TOOL_OPTIONS,JDK_JAVA_OPTIONS,MAVEN_HOME,KOTLIN_HOME"
      - equal:
          path: data.jvmAutoDiscoveryCommandSignals
          value: "java,-jar,.jar,.war,.kts"
      - equal:
          path: data.jvmAutoDiscoveryImageSignals
          value: "openjdk,temurin,corretto,bitnami/java,kafka,jenkins/jenkins,custom-kotlin"

  - it: does not roll action-taker when the rightsizing ConfigMap changes
    template: templates/action-taker/action-taker.yaml
    values:
      - ../render/fixtures/enabled-values.yaml
    asserts:
      - notExists:
          path: spec.template.metadata.annotations["checksum/pilot-config"]
