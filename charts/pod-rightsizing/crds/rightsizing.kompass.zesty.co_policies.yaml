---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: policies.rightsizing.kompass.zesty.co
spec:
  group: rightsizing.kompass.zesty.co
  names:
    kind: Policy
    listKind: PolicyList
    plural: policies
    shortNames:
    - policy
    singular: policy
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Policy is the Schema for the rightsizing policy API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PolicySpec defines the desired state of Policy.
            properties:
              appList:
                description: Workloads managed by this policy.
                items:
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - kind
                  - name
                  - namespace
                  type: object
                type: array
              appSelector:
                description: Label selector matching workloads this policy applies
                  to.
                properties:
                  labels:
                    description: Label selector used to select workloads managed by
                      this policy. The `matchLabels` and `matchExpressions` requirements
                      are ANDed. An empty selector matches all workloads, and a null
                      selector matches no workloads.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    properties:
                      operator:
                        description: Specifies whether the namespaces in `values`
                          are included in or excluded from workload selection (Include,
                          Exclude).
                        enum:
                        - Include
                        - Exclude
                        type: string
                      values:
                        description: Namespaces to include in or exclude from workload
                          selection.
                        items:
                          type: string
                        type: array
                    required:
                    - operator
                    - values
                    type: object
                type: object
              cooldownPeriod:
                default: 120m
                description: Minimum time between consecutive rightsizing changes
                  to the same workload.
                format: duration
                type: string
              cpu:
                description: CPU resource tuning parameters.
                properties:
                  bufferPercentage:
                    default: 20
                    description: Percentage added to the recommended CPU request as
                      a safety buffer.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  ignoreThrottlingEvent:
                    default: false
                    description: Specifies whether CPU throttling events are ignored
                      when evaluating rollback of a rightsizing change.
                    type: boolean
                  minimumImpactPercentage:
                    default: 10
                    description: Minimum percentage difference between the current
                      and recommended CPU requests required to apply a change.
                    maximum: 100
                    minimum: 0
                    type: integer
                  minimumStepForScaleUp:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100m
                    description: Minimum increase in CPU request that a scale-up change
                      can apply.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  minimumValueForScaleDown:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10m
                    description: Minimum CPU request that a scale-down change can
                      set.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  optimizationStrategy:
                    default: p95
                    description: Specifies how CPU usage samples are aggregated over
                      the lookback period (p85, p95, max).
                    enum:
                    - p85
                    - p95
                    - max
                    type: string
                  replicaAggregationMethod:
                    default: max
                    description: Specifies how CPU usage is aggregated across Pod
                      replicas for each sample (p85, p95, max, custom1, custom2).
                    enum:
                    - p85
                    - p95
                    - max
                    - custom1
                    - custom2
                    type: string
                required:
                - bufferPercentage
                - ignoreThrottlingEvent
                - minimumImpactPercentage
                - minimumStepForScaleUp
                - minimumValueForScaleDown
                - optimizationStrategy
                - replicaAggregationMethod
                type: object
              dataCoveragePercentage:
                default: 70
                description: Minimum percentage of the lookback period for which metrics
                  must be available before a recommendation is generated.
                maximum: 100
                minimum: 0
                type: integer
              description:
                description: Human-readable description of the policy.
                type: string
              evictPodsInDeferredState:
                default: true
                description: Specifies whether Pods associated with deferred actions
                  are evicted when the actions are created. The default is false.
                type: boolean
              lookbackPeriod:
                default: 72h
                description: Period of historical workload metrics used to generate
                  recommendations.
                format: duration
                type: string
              memory:
                description: Memory resource tuning parameters.
                properties:
                  bufferPercentage:
                    default: 20
                    description: Percentage added to the recommended memory request
                      as a safety buffer.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  ignoreOomEvent:
                    default: false
                    description: Specifies whether out-of-memory events are ignored
                      when evaluating rollback of a rightsizing change.
                    type: boolean
                  minimumImpactPercentage:
                    default: 10
                    description: Minimum percentage difference between the current
                      and recommended memory requests required to apply a change.
                    maximum: 100
                    minimum: 0
                    type: integer
                  minimumStepForScaleUp:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100Mi
                    description: Minimum increase in memory request that a scale-up
                      change can apply.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  minimumValueForScaleDown:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 10Mi
                    description: Minimum memory request that a scale-down change can
                      set.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  optimizationStrategy:
                    default: p95
                    description: Specifies how memory usage samples are aggregated
                      over the lookback period (p95, p99, max).
                    enum:
                    - p95
                    - p99
                    - max
                    type: string
                  replicaAggregationMethod:
                    default: max
                    description: Specifies how memory usage is aggregated across Pod
                      replicas for each sample (p95, p99, max, custom1, custom2).
                    enum:
                    - p95
                    - p99
                    - max
                    - custom1
                    - custom2
                    type: string
                required:
                - bufferPercentage
                - ignoreOomEvent
                - minimumImpactPercentage
                - minimumStepForScaleUp
                - minimumValueForScaleDown
                - optimizationStrategy
                - replicaAggregationMethod
                type: object
              preferInPlace:
                description: Specifies whether in-place resource updates are preferred
                  when supported. In-place updates require Kubernetes 1.33 or later.
                type: boolean
              priority:
                description: Policy precedence when multiple policies match a workload.
                  Lower values have higher priority.
                format: int64
                minimum: 0
                type: integer
              startupBoost:
                properties:
                  cpu:
                    description: CPU Boost
                    properties:
                      multiplier:
                        description: Value by which the CPU request is multiplied
                          during the startup boost.
                        minimum: 1
                        type: number
                    required:
                    - multiplier
                    type: object
                  duration:
                    description: Length of time the startup boost is applied after
                      a Pod is created.
                    format: duration
                    type: string
                  memory:
                    description: Memory Boost
                    properties:
                      multiplier:
                        description: Value by which the memory request is multiplied
                          during the startup boost.
                        minimum: 1
                        type: number
                    required:
                    - multiplier
                    type: object
                required:
                - duration
                type: object
                x-kubernetes-validations:
                - message: at least one of cpu or memory must be specified
                  rule: has(self.cpu) || has(self.memory)
            required:
            - cooldownPeriod
            - dataCoveragePercentage
            - description
            - lookbackPeriod
            - preferInPlace
            - priority
            type: object
            x-kubernetes-validations:
            - message: startupBoost requires preferInPlace to be true
              rule: '!has(self.startupBoost) || self.preferInPlace'
            - message: cpu optimization cannot be removed from an existing policy
              rule: '!(has(oldSelf.cpu) && !has(self.cpu))'
            - message: memory optimization cannot be removed from an existing policy
              rule: '!(has(oldSelf.memory) && !has(self.memory))'
          status:
            description: PolicyStatus defines the observed state of Policy
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of policy validity and state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              customReplicaAggregationMethods:
                description: Available custom per-sample aggregation strategies.
                properties:
                  cpu:
                    properties:
                      custom1:
                        type: integer
                      custom2:
                        type: integer
                    type: object
                  memory:
                    properties:
                      custom1:
                        type: integer
                      custom2:
                        type: integer
                    type: object
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
